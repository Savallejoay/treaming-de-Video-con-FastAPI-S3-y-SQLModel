<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Stream | Video Platform</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root { 
            --primary: #0d0d1a;      
            --secondary: #9b51e0;    
            --accent: #00f2ff;       
            --neon-pink: #ff00ff;   
            --text: #e0e0e0;         
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--primary);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(155, 81, 224, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.1) 0%, transparent 40%);
            color: var(--text);
            margin: 0;
            overflow-x: hidden;
        }

        header{ 
            background: rgba(13, 13, 26, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--secondary);
            box-shadow: 0 0 20px rgba(155, 81, 224, 0.5);
            padding: 2.5rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 10px var(--secondary), 0 0 20px var(--secondary);
            margin: 0;
        }

        .filtros {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .btn-neon {
            background: transparent;
            border: 2px solid var(--secondary);
            color: #fff;
            padding: 12px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            min-width: 140px;
        }

        .btn-neon:hover,
        .btn-neon.active {
            background: var(--secondary);
            box-shadow: 0 0 15px var(--secondary), 0 0 30px var(--secondary);
        }

        #contenedor-videos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--glass);
            border: 1px solid rgba(155, 81, 224, 0.3);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            transition: all 0.4s;
            cursor: pointer;
        }

        .card:hover { 
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.4);
        }
        
        figure {
            margin: 0;
            height: 180px;
            overflow: hidden;
            background: #000;
        }

        .card-video { 
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; 
        }

        .info { 
            padding: 20px; 
            text-align: center;
        }

        h2 {
            color: white;
            font-size: 1rem;
            margin: 0 0 10px 0;
        }

        p {
            color: var(--accent);
            font-size: 0.8rem;
            margin: 0;
        }

        footer {
            background: rgba(13, 13, 26, 0.9);
            border-top: 1px solid var(--secondary);
            color: var(--secondary);
            padding: 25px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>NEON STREAM</h1>
</header>

<nav class="filtros" id="menu-categorias"></nav>

<main>
    <section id="contenedor-videos"></section>
</main>

<footer>
    <p>NEON STREAM © 2026</p>
</footer>

<script>
const API = "http://127.0.0.1:8000/api";
let videosMemoria = [];

async function init() {
    await cargarVideos();
    await cargarCategorias();
}

async function cargarVideos() {
    try {
        const res = await fetch(`${API}/videos`);
        videosMemoria = await res.json();
        renderizar(videosMemoria);
    } catch (error) {
        console.error("Error cargando videos:", error);
    }
}

async function cargarCategorias() {
    const res = await fetch(`${API}/categories`);
    const categorias = await res.json();

    const nav = document.getElementById("menu-categorias");
    nav.textContent = ""; 

    const btnTodos = document.createElement("button");
    btnTodos.className = "btn-neon active";
    btnTodos.textContent = "Todos";
    btnTodos.addEventListener("click", (e) => filtrar("all", e));
    nav.appendChild(btnTodos);

    categorias.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "btn-neon";
        btn.textContent = cat.name;
        btn.addEventListener("click", (e) => filtrar(cat.id, e));
        nav.appendChild(btn);
    });
}

function filtrar(categoryId, event) {
    document.querySelectorAll(".btn-neon").forEach(b => b.classList.remove("active"));
    event.currentTarget.classList.add("active");

    if (categoryId === "all") {
        renderizar(videosMemoria);
        return;
    }

    const filtrados = videosMemoria.filter(v => v.category_id === categoryId);
    renderizar(filtrados);
}

function renderizar(videos) {
    const contenedor = document.getElementById("contenedor-videos");
    contenedor.textContent = ""; 

    videos.forEach(video => {
        const article = document.createElement("article");
        article.className = "card";
        
        article.addEventListener("mouseenter", (e) => {
            const v = e.currentTarget.querySelector('video');
            v.play();
        });
        article.addEventListener("mouseleave", (e) => {
            const v = e.currentTarget.querySelector('video');
            v.pause();
            v.currentTime = 0.5; 
        });

        article.addEventListener("click", () => {
            window.location.href = `player.html?id=${video.id}`;
        });

        const figure = document.createElement("figure");
        const vid = document.createElement("video");
        vid.src = `${video.video_url}#t=0.5`;
        vid.className = "card-video";
        vid.muted = true;
        vid.loop = true;
        vid.preload = "metadata";
        
        figure.appendChild(vid);

        const info = document.createElement("div");
        info.className = "info";

        const title = document.createElement("h2");
        title.textContent = video.title;

        const desc = document.createElement("p");
        desc.textContent = video.description;

        info.appendChild(title);
        info.appendChild(desc);
        article.appendChild(figure);
        article.appendChild(info);
        contenedor.appendChild(article);
    });
}

document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
