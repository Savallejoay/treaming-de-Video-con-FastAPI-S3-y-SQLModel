<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player | Neon Stream</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0d0d1a;
            --secondary: #9b51e0;
            --accent: #00f2ff;
            --text: #e0e0e0;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: var(--primary);
            color: var(--text);
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--secondary);
            box-shadow: 0 0 15px var(--secondary);
        }

        header h1 {
            margin: 0;
            color: white;
            font-size: 1.5rem;
        }

        .container {
            display: grid;
            grid-template-columns: 3fr 1fr; 
            gap: 25px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .video-box {
            background: var(--glass);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(155, 81, 224, 0.2);
        }

        video {
            width: 100%;
            border-radius: 10px;
            background: black;
            aspect-ratio: 16 / 9;
        }

        .info h2 {
            margin: 15px 0 5px 0;
            color: var(--accent);
        }

        .info p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .comments {
            background: var(--glass);
            padding: 20px;
            border-radius: 15px;
        }

        .comment {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 12px 0;
            font-size: 0.9rem;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        button {
            background: var(--secondary);
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        button:hover {
            box-shadow: 0 0 15px var(--secondary);
            transform: translateY(-2px);
        }

        .recommendations-sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .rec-item {
            display: flex;
            gap: 12px;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: 0.3s;
            background: rgba(255,255,255,0.02);
        }

        .rec-item:hover {
            background: rgba(155, 81, 224, 0.1);
        }

        .rec-thumb {
            width: 140px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            background: black;
        }

        .rec-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .rec-info strong {
            font-size: 0.85rem;
            display: block;
            margin-bottom: 5px;
        }

        .rec-info span {
            font-size: 0.7rem;
            color: var(--accent);
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<header>
    <h1>NEON STREAM PLAYER</h1>
</header>

<div class="container">
    <div class="main-content">
        <div class="video-box">
            <video id="videoPlayer" controls autoplay muted playsinline></video>
            <div class="info">
                <h2 id="title">Cargando...</h2>
                <p id="description"></p>
            </div>
        </div>

        <div class="comments">
            <h3>Comentarios</h3>
            <div id="commentsList"></div>

            <div style="margin-top: 20px; border-top: 1px solid var(--secondary); padding-top: 15px;">
                <input id="username" placeholder="Tu nombre">
                <input id="commentText" placeholder="Escribe un comentario...">
                <button id="btnEnviar">ENVIAR COMENTARIO</button>
            </div>
        </div>
    </div>

    <div class="recommendations-sidebar">
        <h3>Siguiente</h3>
        <div id="recList"></div>
    </div>
</div>

<script>
const API = "http://127.0.0.1:8000/api";
const params = new URLSearchParams(window.location.search);
const videoId = params.get("id");

function setupEvents() {
    document.getElementById("btnEnviar").addEventListener("click", addComment);
}

async function loadVideo() {
    try {
        const res = await fetch(`${API}/videos/${videoId}`);
        const video = await res.json();

        document.getElementById("title").textContent = video.title;
        document.getElementById("description").textContent = video.description;
        
        const player = document.getElementById("videoPlayer");
        player.src = video.video_url;

        loadRecommendations();
    } catch (e) {
        console.error("Error cargando video:", e);
    }
}

async function loadComments() {
    const res = await fetch(`${API}/comments/${videoId}`);
    const comments = await res.json();

    const container = document.getElementById("commentsList");
    container.textContent = ""; 

    comments.forEach(c => {
        const div = document.createElement("div");
        div.className = "comment";
        
        const userSpan = document.createElement("strong");
        userSpan.textContent = `${c.username}: `;
        userSpan.style.color = "var(--accent)";

        const contentSpan = document.createElement("span");
        contentSpan.textContent = c.content;

        div.appendChild(userSpan);
        div.appendChild(contentSpan);
        container.appendChild(div);
    });
}

async function addComment() {
    const usernameInput = document.getElementById("username");
    const contentInput = document.getElementById("commentText");

    const username = usernameInput.value.trim();
    const content = contentInput.value.trim();

    if (!username || !content) {
        alert("Por favor rellena ambos campos");
        return;
    }

    const res = await fetch(`${API}/comments`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            username: username,
            content: content,
            video_id: parseInt(videoId)
        })
    });

    if (res.ok) {
        contentInput.value = ""; 
        loadComments(); 
    }
}

async function loadRecommendations() {
    try {
        const res = await fetch(`${API}/videos`);
        const videos = await res.json();

        const list = document.getElementById("recList");
        list.textContent = "";

        const videosShuffle = videos.sort(() => 0.5 - Math.random());

        videosShuffle.forEach(v => {
    
            if (v.id == videoId) return;

            if (list.childElementCount >= 6) return;

            const item = document.createElement("div");
            item.className = "rec-item";

            item.innerHTML = `
                <video class="rec-thumb" src="${v.video_url}#t=0.5" muted preload="metadata"></video>
                <div class="rec-info">
                    <strong>${v.title}</strong>
                    <span>Siguiente video</span>
                </div>
            `;

            item.addEventListener("click", () => {
                window.location.href = `player.html?id=${v.id}`;
            });

            list.appendChild(item);
        });
    } catch (error) {
        console.error("Error cargando recomendaciones:", error);
    }
}

document.addEventListener("DOMContentLoaded", () => {
    setupEvents();
    loadVideo();
    loadComments();
});
</script>

</body>
</html>
